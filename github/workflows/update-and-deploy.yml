name: Monthly DART update
on:
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dart-monthly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Collect DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/agent.py
      - run: python src/build_dashboard.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json data docs/index.html
          git diff --cached --quiet || git commit -m "chore: monthly DART update"
          git push
